##
## Strfry config — development relay for Inferno Chat
##

db = "/app/strfry-db/"

relay {
    bind = "0.0.0.0"
    port = 7777

    info {
        name = "Inferno Dev Relay"
        description = "Local development relay for cross-instance testing"
        contact = ""
    }

    maxWebsocketPayloadSize = 131072
    autoPingSeconds = 55
    enableTcpKeepalive = false

    writePolicy {
        plugin = ""
    }
}
