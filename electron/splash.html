<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inferno</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0a09;
      color: #e1e0df;
      overflow: hidden;
      -webkit-app-region: drag;
      user-select: none;
    }
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 80%, rgba(220, 38, 38, 0.12) 0%, transparent 60%);
      pointer-events: none;
    }
    .logo {
      font-size: 48px;
      font-weight: 700;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #dc2626, #f87171);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
      position: relative;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(225, 224, 223, 0.08);
      border-top-color: #dc2626;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #status {
      font-size: 13px;
      color: #656361;
    }
  </style>
</head>
<body>
  <div class="logo">INFERNO</div>
  <div class="spinner"></div>
  <div id="status">Starting...</div>

  <script>
    function updateStatus(msg) {
      document.getElementById('status').textContent = msg;
    }
    if (window.electronAPI) {
      window.electronAPI.onStatusUpdate(updateStatus);
    }
  </script>
</body>
</html>
