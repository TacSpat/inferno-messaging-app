name: Release Tauri Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  RUBY_VERSION: '3.4.2'
  RAILS_ENV: production

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: macos-14
            target: aarch64-apple-darwin
          - platform: macos-13
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # ─── System dependencies ───────────────────────────────────
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev libsodium23 libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf libfuse2

      - name: Install macOS dependencies
        if: startsWith(matrix.platform, 'macos')
        run: brew install libsodium

      - name: Install Windows libsodium
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $url = "https://download.libsodium.org/libsodium/releases/libsodium-1.0.20-stable-msvc.zip"
          Invoke-WebRequest -Uri $url -OutFile libsodium.zip
          Expand-Archive libsodium.zip -DestinationPath libsodium

      # ─── Ruby + Bun ────────────────────────────────────────────
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          bundle-without: development:test

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # ─── Build Tebako sidecar ──────────────────────────────────
      - name: Install Tebako
        run: gem install tebako

      - name: Precompile assets
        shell: bash
        run: |
          bun install --frozen-lockfile
          SECRET_KEY_BASE=placeholder bundle exec rails assets:precompile

      - name: Build Tebako sidecar binary
        shell: bash
        run: |
          rm -rf node_modules .git tmp/cache log
          ext=""
          if [[ "${{ matrix.platform }}" == "windows-latest" ]]; then ext=".exe"; fi
          tebako press --root=. --entry-point=bin/rails \
            --output="src-tauri/binaries/inferno-server-${{ matrix.target }}${ext}" \
            --Ruby=${{ env.RUBY_VERSION }}

      # ─── Rust toolchain ────────────────────────────────────────
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ─── Build & release with Tauri action ─────────────────────
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Inferno ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install.'
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
