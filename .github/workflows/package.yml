name: Package Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  RUBY_VERSION: '3.4.2'
  RAILS_ENV: production

jobs:
  # ─── Linux (AppImage + deb) ─────────────────────────────────
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          bundler: latest

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Precompile assets
        run: |
          bun install --frozen-lockfile
          SKIP_BUN_INSTALL=true SECRET_KEY_BASE=placeholder bundle exec rails assets:precompile

      - name: Cache portable Ruby
        id: ruby-cache
        uses: actions/cache@v4
        with:
          path: ruby-sidecar/ruby
          key: portable-ruby-slim-linux-${{ env.RUBY_VERSION }}

      - name: Download portable Ruby
        if: steps.ruby-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/rbenv/ruby-build.git /tmp/ruby-build
          RUBY_CONFIGURE_OPTS="--disable-install-doc" /tmp/ruby-build/bin/ruby-build ${{ env.RUBY_VERSION }} ruby-sidecar/ruby

      - name: Slim Ruby
        if: steps.ruby-cache.outputs.cache-hit != 'true'
        run: |
          RUBY_DIR="ruby-sidecar/ruby"
          echo "Before: $(du -sh "$RUBY_DIR" | cut -f1)"
          rm -rf "$RUBY_DIR"/share/ri "$RUBY_DIR"/share/doc "$RUBY_DIR"/share/man
          rm -rf "$RUBY_DIR"/include
          find "$RUBY_DIR" -name '*.a' -delete
          for gem in irb rdoc rbs typeprof debug racc reline rdbg syntax_suggest; do
            rm -rf "$RUBY_DIR"/lib/ruby/gems/*/gems/${gem}-*
            rm -f "$RUBY_DIR"/lib/ruby/gems/*/specifications/${gem}-*.gemspec
            rm -f "$RUBY_DIR"/lib/ruby/gems/*/specifications/default/${gem}-*.gemspec
          done
          rm -rf "$RUBY_DIR"/lib/ruby/gems/*/cache
          find "$RUBY_DIR" -name '*.so' -exec strip --strip-unneeded {} + 2>/dev/null || true
          echo "After:  $(du -sh "$RUBY_DIR" | cut -f1)"

      - name: Cache sidecar gems
        id: gems-cache
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: sidecar-gems-slim-linux-${{ env.RUBY_VERSION }}-${{ hashFiles('Gemfile.lock') }}-v3

      - name: Bundle gems for sidecar
        if: steps.gems-cache.outputs.cache-hit != 'true'
        run: |
          export PATH="$PWD/ruby-sidecar/ruby/bin:$PATH"
          ruby-sidecar/ruby/bin/gem install bundler --no-document
          ruby-sidecar/ruby/bin/bundle config set --local deployment true
          ruby-sidecar/ruby/bin/bundle config set --local without 'development test'
          ruby-sidecar/ruby/bin/bundle config set --local path vendor/bundle
          ruby-sidecar/ruby/bin/bundle install
          # Remove test-only gems that bundler downloads despite --without
          rm -rf vendor/bundle/ruby/*/gems/selenium-webdriver-*
          rm -rf vendor/bundle/ruby/*/gems/capybara-*
          rm -rf vendor/bundle/ruby/*/gems/cucumber-*
          rm -rf vendor/bundle/ruby/*/gems/database_cleaner-*
          rm -rf vendor/bundle/ruby/*/gems/webmock-*
          rm -rf vendor/bundle/ruby/*/gems/shoulda-*

      - name: Slim gems
        if: steps.gems-cache.outputs.cache-hit != 'true'
        run: |
          GEMS_DIR="vendor/bundle"
          echo "Before: $(du -sh "$GEMS_DIR" | cut -f1)"
          find "$GEMS_DIR" -type d \( -name spec -o -name test -o -name tests -o -name features \) -exec rm -rf {} + 2>/dev/null || true
          find "$GEMS_DIR" -type d -name ext -path '*/gems/*/ext' | while read ext_dir; do
            find "$ext_dir" \( -name '*.c' -o -name '*.h' -o -name '*.o' -o -name '*.cpp' \) -delete
          done
          find "$GEMS_DIR" -type d -name cache -path '*/cache' -exec rm -rf {} + 2>/dev/null || true
          find "$GEMS_DIR" \( -name '*.md' -o -name '*.txt' -o -name '*.rdoc' \) \
            ! -name 'LICENSE*' ! -name 'COPYING*' -delete 2>/dev/null || true
          find "$GEMS_DIR" -name 'CHANGELOG*' -delete 2>/dev/null || true
          find "$GEMS_DIR" -name 'HISTORY*' -delete 2>/dev/null || true
          find "$GEMS_DIR" -name 'NEWS*' -delete 2>/dev/null || true
          find "$GEMS_DIR" -name '*.so' -exec strip --strip-unneeded {} + 2>/dev/null || true
          echo "After:  $(du -sh "$GEMS_DIR" | cut -f1)"

      - name: Assemble sidecar
        run: |
          mkdir -p sidecar-stage
          # Copy Rails app excluding dev/CI files AND vendor/bundle (copied separately)
          rsync -a --exclude='.git' --exclude='node_modules' --exclude='tmp' \
            --exclude='log' --exclude='sidecar-stage' --exclude='ruby-sidecar' \
            --exclude='.github' --exclude='dist' --exclude='spec' --exclude='test' \
            --exclude='features' --exclude='.env*' --exclude='electron' \
            --exclude='electron-builder.yml' --exclude='icons' \
            --exclude='doc' --exclude='packaging' --exclude='.claude' \
            --exclude='.rspec' --exclude='.rubocop.yml' --exclude='Procfile.dev' \
            --exclude='bun.config.js' --exclude='bun.lock' --exclude='plan.md' \
            --exclude='.tebako.yml' --exclude='.dockerignore' --exclude='Dockerfile' \
            --exclude='.kamal' --exclude='storage/*.sqlite3' \
            --exclude='vendor/bundle' --exclude='.bundle' \
            ./ sidecar-stage/app/
          # Copy sidecar-specific vendor/bundle (slimmed, no test gems)
          cp -r vendor/bundle sidecar-stage/app/vendor/bundle
          # Safety: remove test gems that may have leaked through
          find sidecar-stage/app/vendor/bundle -maxdepth 4 -type d -name 'selenium-webdriver-*' -exec rm -rf {} + 2>/dev/null || true
          find sidecar-stage/app/vendor/bundle -maxdepth 4 -type d -name 'capybara-*' -exec rm -rf {} + 2>/dev/null || true
          # Create .bundle/config so bundler finds the gems
          mkdir -p sidecar-stage/app/.bundle
          cat > sidecar-stage/app/.bundle/config << 'BUNDLECFG'
          ---
          BUNDLE_PATH: "vendor/bundle"
          BUNDLE_WITHOUT: "development:test"
          BUNDLE_DEPLOYMENT: "true"
          BUNDLECFG
          # Copy portable Ruby
          cp -r ruby-sidecar/ruby sidecar-stage/ruby
          # Create launcher script
          cat > sidecar-stage/start.sh << 'LAUNCHER'
          #!/bin/sh
          DIR="$(cd "$(dirname "$0")" && pwd)"
          export PATH="$DIR/ruby/bin:$PATH"
          export LD_LIBRARY_PATH="$DIR/ruby/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          RUBY_GEM_DIR="$DIR/ruby/lib/ruby/gems/$(ls "$DIR/ruby/lib/ruby/gems/" | head -1)"
          VENDOR_GEM_DIR="$DIR/app/vendor/bundle/ruby/$(ls "$DIR/app/vendor/bundle/ruby/" | head -1)"
          export GEM_HOME="$VENDOR_GEM_DIR"
          export GEM_PATH="$VENDOR_GEM_DIR:$RUBY_GEM_DIR"
          export BUNDLE_GEMFILE="$DIR/app/Gemfile"
          cd "$DIR/app"
          exec "$DIR/ruby/bin/ruby" bin/rails "$@"
          LAUNCHER
          chmod +x sidecar-stage/start.sh

      - name: Build Electron app
        run: |
          bun install --frozen-lockfile
          bun run electron:build --linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Inferno-Linux
          path: |
            dist/*.AppImage
            dist/*.deb

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/latest-linux.yml

  # ─── macOS (dmg + zip) ─────────────────────────────────────
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          bundler: latest

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Precompile assets
        run: |
          bun install --frozen-lockfile
          SKIP_BUN_INSTALL=true SECRET_KEY_BASE=placeholder bundle exec rails assets:precompile

      - name: Cache portable Ruby
        id: ruby-cache
        uses: actions/cache@v4
        with:
          path: ruby-sidecar/ruby
          key: portable-ruby-slim-macos-${{ env.RUBY_VERSION }}

      - name: Download portable Ruby
        if: steps.ruby-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/rbenv/ruby-build.git /tmp/ruby-build
          RUBY_CONFIGURE_OPTS="--disable-install-doc" /tmp/ruby-build/bin/ruby-build ${{ env.RUBY_VERSION }} ruby-sidecar/ruby

      - name: Slim Ruby
        if: steps.ruby-cache.outputs.cache-hit != 'true'
        run: |
          RUBY_DIR="ruby-sidecar/ruby"
          echo "Before: $(du -sh "$RUBY_DIR" | cut -f1)"
          rm -rf "$RUBY_DIR"/share/ri "$RUBY_DIR"/share/doc "$RUBY_DIR"/share/man
          rm -rf "$RUBY_DIR"/include
          find "$RUBY_DIR" -name '*.a' -delete
          for gem in irb rdoc rbs typeprof debug racc reline rdbg syntax_suggest; do
            rm -rf "$RUBY_DIR"/lib/ruby/gems/*/gems/${gem}-*
            rm -f "$RUBY_DIR"/lib/ruby/gems/*/specifications/${gem}-*.gemspec
            rm -f "$RUBY_DIR"/lib/ruby/gems/*/specifications/default/${gem}-*.gemspec
          done
          rm -rf "$RUBY_DIR"/lib/ruby/gems/*/cache
          find "$RUBY_DIR" -name '*.dylib' -exec strip -x {} + 2>/dev/null || true
          find "$RUBY_DIR" -name '*.bundle' -exec strip -x {} + 2>/dev/null || true
          echo "After:  $(du -sh "$RUBY_DIR" | cut -f1)"

      - name: Cache sidecar gems
        id: gems-cache
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: sidecar-gems-slim-macos-${{ env.RUBY_VERSION }}-${{ hashFiles('Gemfile.lock') }}-v3

      - name: Bundle gems for sidecar
        if: steps.gems-cache.outputs.cache-hit != 'true'
        run: |
          export PATH="$PWD/ruby-sidecar/ruby/bin:$PATH"
          ruby-sidecar/ruby/bin/gem install bundler --no-document
          ruby-sidecar/ruby/bin/bundle config set --local deployment true
          ruby-sidecar/ruby/bin/bundle config set --local without 'development test'
          ruby-sidecar/ruby/bin/bundle config set --local path vendor/bundle
          ruby-sidecar/ruby/bin/bundle install
          rm -rf vendor/bundle/ruby/*/gems/selenium-webdriver-*
          rm -rf vendor/bundle/ruby/*/gems/capybara-*
          rm -rf vendor/bundle/ruby/*/gems/cucumber-*
          rm -rf vendor/bundle/ruby/*/gems/database_cleaner-*
          rm -rf vendor/bundle/ruby/*/gems/webmock-*
          rm -rf vendor/bundle/ruby/*/gems/shoulda-*

      - name: Slim gems
        if: steps.gems-cache.outputs.cache-hit != 'true'
        run: |
          GEMS_DIR="vendor/bundle"
          echo "Before: $(du -sh "$GEMS_DIR" | cut -f1)"
          find "$GEMS_DIR" -type d \( -name spec -o -name test -o -name tests -o -name features \) -exec rm -rf {} + 2>/dev/null || true
          find "$GEMS_DIR" -type d -name ext -path '*/gems/*/ext' | while read ext_dir; do
            find "$ext_dir" \( -name '*.c' -o -name '*.h' -o -name '*.o' -o -name '*.cpp' \) -delete
          done
          find "$GEMS_DIR" -type d -name cache -path '*/cache' -exec rm -rf {} + 2>/dev/null || true
          find "$GEMS_DIR" \( -name '*.md' -o -name '*.txt' -o -name '*.rdoc' \) \
            ! -name 'LICENSE*' ! -name 'COPYING*' -delete 2>/dev/null || true
          find "$GEMS_DIR" -name 'CHANGELOG*' -delete 2>/dev/null || true
          find "$GEMS_DIR" -name 'HISTORY*' -delete 2>/dev/null || true
          find "$GEMS_DIR" -name 'NEWS*' -delete 2>/dev/null || true
          find "$GEMS_DIR" -name '*.dylib' -exec strip -x {} + 2>/dev/null || true
          find "$GEMS_DIR" -name '*.bundle' -exec strip -x {} + 2>/dev/null || true
          echo "After:  $(du -sh "$GEMS_DIR" | cut -f1)"

      - name: Assemble sidecar
        run: |
          mkdir -p sidecar-stage
          rsync -a --exclude='.git' --exclude='node_modules' --exclude='tmp' \
            --exclude='log' --exclude='sidecar-stage' --exclude='ruby-sidecar' \
            --exclude='.github' --exclude='dist' --exclude='spec' --exclude='test' \
            --exclude='features' --exclude='.env*' --exclude='electron' \
            --exclude='electron-builder.yml' --exclude='icons' \
            --exclude='doc' --exclude='packaging' --exclude='.claude' \
            --exclude='.rspec' --exclude='.rubocop.yml' --exclude='Procfile.dev' \
            --exclude='bun.config.js' --exclude='bun.lock' --exclude='plan.md' \
            --exclude='.tebako.yml' --exclude='.dockerignore' --exclude='Dockerfile' \
            --exclude='.kamal' --exclude='storage/*.sqlite3' \
            --exclude='vendor/bundle' --exclude='.bundle' \
            ./ sidecar-stage/app/
          cp -r vendor/bundle sidecar-stage/app/vendor/bundle
          find sidecar-stage/app/vendor/bundle -maxdepth 4 -type d -name 'selenium-webdriver-*' -exec rm -rf {} + 2>/dev/null || true
          find sidecar-stage/app/vendor/bundle -maxdepth 4 -type d -name 'capybara-*' -exec rm -rf {} + 2>/dev/null || true
          mkdir -p sidecar-stage/app/.bundle
          cat > sidecar-stage/app/.bundle/config << 'BUNDLECFG'
          ---
          BUNDLE_PATH: "vendor/bundle"
          BUNDLE_WITHOUT: "development:test"
          BUNDLE_DEPLOYMENT: "true"
          BUNDLECFG
          cp -r ruby-sidecar/ruby sidecar-stage/ruby
          cat > sidecar-stage/start.sh << 'LAUNCHER'
          #!/bin/sh
          DIR="$(cd "$(dirname "$0")" && pwd)"
          export PATH="$DIR/ruby/bin:$PATH"
          export DYLD_LIBRARY_PATH="$DIR/ruby/lib${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
          RUBY_GEM_DIR="$DIR/ruby/lib/ruby/gems/$(ls "$DIR/ruby/lib/ruby/gems/" | head -1)"
          VENDOR_GEM_DIR="$DIR/app/vendor/bundle/ruby/$(ls "$DIR/app/vendor/bundle/ruby/" | head -1)"
          export GEM_HOME="$VENDOR_GEM_DIR"
          export GEM_PATH="$VENDOR_GEM_DIR:$RUBY_GEM_DIR"
          export BUNDLE_GEMFILE="$DIR/app/Gemfile"
          cd "$DIR/app"
          exec "$DIR/ruby/bin/ruby" bin/rails "$@"
          LAUNCHER
          chmod +x sidecar-stage/start.sh

      - name: Build Electron app
        run: |
          bun install --frozen-lockfile
          bun run electron:build --mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Inferno-macOS
          path: |
            dist/*.dmg
            dist/*.zip

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml

  # ─── Windows (NSIS installer) ──────────────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          bundler: latest

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Precompile assets
        run: |
          bun install --frozen-lockfile
          bun run build
          bun run build:css
          $env:SECRET_KEY_BASE = "placeholder"
          $env:SKIP_JS_BUILD = "true"
          $env:SKIP_CSS_BUILD = "true"
          bundle exec rails assets:precompile

      - name: Cache portable Ruby
        id: ruby-cache
        uses: actions/cache@v4
        with:
          path: ruby-sidecar/ruby
          key: portable-ruby-slim-windows-${{ env.RUBY_VERSION }}

      - name: Download portable Ruby (RubyInstaller)
        if: steps.ruby-cache.outputs.cache-hit != 'true'
        run: |
          $rubyVer = "${{ env.RUBY_VERSION }}"
          $url = "https://github.com/oneclick/rubyinstaller2/releases/download/RubyInstaller-${rubyVer}-1/rubyinstaller-${rubyVer}-1-x64.7z"
          Write-Host "Downloading: $url"
          Invoke-WebRequest -Uri $url -OutFile ruby.7z
          & "C:\Program Files\7-Zip\7z.exe" x ruby.7z -oruby-sidecar
          $extracted = Get-ChildItem ruby-sidecar -Directory | Select-Object -First 1
          Rename-Item $extracted.FullName "ruby"

      - name: Slim Ruby
        if: steps.ruby-cache.outputs.cache-hit != 'true'
        run: |
          $rubyDir = "ruby-sidecar\ruby"
          $before = (Get-ChildItem -Recurse $rubyDir | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host "Before: $([math]::Round($before, 1)) MB"
          Remove-Item -Recurse -Force "$rubyDir\share\ri", "$rubyDir\share\doc", "$rubyDir\share\man" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$rubyDir\include" -ErrorAction SilentlyContinue
          Get-ChildItem -Recurse "$rubyDir" -Filter "*.a" | Remove-Item -Force
          $unusedGems = @('irb', 'rdoc', 'rbs', 'typeprof', 'debug', 'racc', 'reline', 'rdbg', 'syntax_suggest')
          foreach ($gem in $unusedGems) {
            Get-ChildItem "$rubyDir\lib\ruby\gems" -Recurse -Directory -Filter "${gem}-*" -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force
            Get-ChildItem "$rubyDir\lib\ruby\gems" -Recurse -Filter "${gem}-*.gemspec" -ErrorAction SilentlyContinue | Remove-Item -Force
          }
          Get-ChildItem "$rubyDir\lib\ruby\gems" -Recurse -Directory -Filter "cache" | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          $after = (Get-ChildItem -Recurse $rubyDir | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host "After:  $([math]::Round($after, 1)) MB"

      - name: Cache sidecar gems
        id: gems-cache
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: sidecar-gems-slim-windows-${{ env.RUBY_VERSION }}-${{ hashFiles('Gemfile.lock') }}-v3

      - name: Bundle gems for sidecar
        if: steps.gems-cache.outputs.cache-hit != 'true'
        run: |
          $rubyBin = "$PWD\ruby-sidecar\ruby\bin"
          $env:PATH = "$rubyBin;$env:PATH"
          Write-Host "Contents of ruby bin dir:"
          Get-ChildItem "$rubyBin" | Select-Object Name
          & "$rubyBin\ruby.exe" -S gem install bundler --no-document
          & "$rubyBin\ruby.exe" -S bundle config set --local deployment true
          & "$rubyBin\ruby.exe" -S bundle config set --local without "development test"
          & "$rubyBin\ruby.exe" -S bundle config set --local path vendor/bundle
          & "$rubyBin\ruby.exe" -S bundle install

      - name: Slim gems
        if: steps.gems-cache.outputs.cache-hit != 'true'
        run: |
          $gemsDir = "vendor\bundle"
          $before = (Get-ChildItem -Recurse $gemsDir | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host "Before: $([math]::Round($before, 1)) MB"
          Get-ChildItem -Recurse $gemsDir -Directory | Where-Object { $_.Name -in @('spec', 'test', 'tests', 'features') } | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Recurse $gemsDir -Directory -Filter "ext" | ForEach-Object {
            Get-ChildItem -Recurse $_.FullName -Include @('*.c', '*.h', '*.o', '*.cpp') | Remove-Item -Force
          }
          Get-ChildItem -Recurse $gemsDir -Directory -Filter "cache" | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Recurse $gemsDir -Include @('*.md', '*.txt', '*.rdoc') | Where-Object { $_.Name -notmatch '^(LICENSE|COPYING)' } | Remove-Item -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Recurse $gemsDir -Include @('CHANGELOG*', 'HISTORY*', 'NEWS*') | Remove-Item -Force -ErrorAction SilentlyContinue
          $after = (Get-ChildItem -Recurse $gemsDir | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host "After:  $([math]::Round($after, 1)) MB"

      - name: Assemble sidecar
        run: |
          New-Item -ItemType Directory -Force -Path sidecar-stage\app
          # Copy Rails app excluding vendor/bundle (copied separately from sidecar gems)
          $exclude = @('.git', 'node_modules', 'tmp', 'log', 'sidecar-stage',
                       'ruby-sidecar', '.github', 'dist', 'spec', 'test',
                       'features', 'electron', 'electron-builder.yml', 'icons',
                       'doc', 'packaging', '.claude', '.rspec', '.rubocop.yml',
                       'Procfile.dev', 'bun.config.js', 'bun.lock', 'plan.md',
                       '.tebako.yml', '.dockerignore', 'Dockerfile', '.kamal',
                       'storage', 'vendor', '.bundle')
          Get-ChildItem -Path . -Exclude $exclude | Copy-Item -Destination sidecar-stage\app -Recurse -Force
          # Copy sidecar-specific vendor/bundle (slimmed, no test gems)
          New-Item -ItemType Directory -Force -Path sidecar-stage\app\vendor
          Copy-Item -Path vendor\bundle -Destination sidecar-stage\app\vendor\bundle -Recurse
          # Safety: remove test gems that may have leaked through
          Get-ChildItem -Recurse sidecar-stage\app\vendor\bundle -Directory -Filter "selenium-webdriver-*" -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force
          Get-ChildItem -Recurse sidecar-stage\app\vendor\bundle -Directory -Filter "capybara-*" -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force
          # Create .bundle/config so bundler finds the gems
          New-Item -ItemType Directory -Force -Path sidecar-stage\app\.bundle
          @"
          ---
          BUNDLE_PATH: "vendor/bundle"
          BUNDLE_WITHOUT: "development:test"
          BUNDLE_DEPLOYMENT: "true"
          "@ | Out-File -FilePath sidecar-stage\app\.bundle\config -Encoding UTF8
          # Copy portable Ruby
          Copy-Item -Path ruby-sidecar\ruby -Destination sidecar-stage\ruby -Recurse
          @"
          @echo off
          set "DIR=%~dp0"
          set "PATH=%DIR%ruby\bin;%PATH%"
          for /d %%G in ("%DIR%app\vendor\bundle\ruby\*") do set "GEM_HOME=%%G"
          for /d %%G in ("%DIR%ruby\lib\ruby\gems\*") do set "RUBY_GEM_DIR=%%G"
          set "GEM_PATH=%GEM_HOME%;%RUBY_GEM_DIR%"
          set "BUNDLE_GEMFILE=%DIR%app\Gemfile"
          cd /d "%DIR%app"
          "%DIR%ruby\bin\ruby.exe" bin/rails %*
          "@ | Out-File -FilePath sidecar-stage\start.bat -Encoding ASCII

      - name: Build Electron app
        run: |
          bun install --frozen-lockfile
          bun run electron:build --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Inferno-Windows
          path: dist/*.exe

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/latest.yml
