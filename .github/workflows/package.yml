name: Package Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  RUBY_VERSION: '3.4.2'
  RAILS_ENV: production

jobs:
  # ─── Linux (AppImage + deb) ─────────────────────────────────
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          bundle-without: development:test

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Precompile assets
        run: |
          bun install --frozen-lockfile
          SKIP_BUN_INSTALL=true SECRET_KEY_BASE=placeholder bundle exec rails assets:precompile

      - name: Prepare for Tebako
        run: |
          cp package.json package.json.bak
          cp bun.lock bun.lock.bak
          cp -r electron electron.bak
          cp electron-builder.yml electron-builder.yml.bak
          rm -rf node_modules .git tmp/cache log

      - name: Build Tebako binary (Docker)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/mnt/w \
            ghcr.io/tamatebako/tebako-ubuntu-20.04:latest \
            tebako press --root=/mnt/w --entry-point=bin/rails --output=/mnt/w/inferno --Ruby=${{ env.RUBY_VERSION }}

      - name: Re-install node dependencies (for Electron)
        run: |
          cp package.json.bak package.json
          cp bun.lock.bak bun.lock
          cp -r electron.bak electron
          cp electron-builder.yml.bak electron-builder.yml
          bun install --frozen-lockfile

      - name: Stage sidecar binary
        run: |
          mkdir -p binaries
          cp inferno binaries/inferno-server

      - name: Build Electron app
        run: bun run electron:build --linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Inferno-Linux
          path: |
            dist/*.AppImage
            dist/*.deb

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/latest-linux.yml

  # ─── macOS (dmg + zip) ─────────────────────────────────────
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.0.1'

      - name: Install system dependencies
        run: |
          brew install zlib ncurses libevent libsodium lz4 xz gdbm pkg-config \
            libyaml curl bison flex binutils libffi double-conversion boost \
            jemalloc fmt glog gnu-sed bash
          echo "$(brew --prefix bison)/bin" >> $GITHUB_PATH

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          bundle-without: development:test

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Tebako
        run: gem install tebako

      - name: Precompile assets
        run: |
          bun install --frozen-lockfile
          SKIP_BUN_INSTALL=true SECRET_KEY_BASE=placeholder bundle exec rails assets:precompile

      - name: Prepare for Tebako
        run: |
          cp package.json package.json.bak
          cp bun.lock bun.lock.bak
          cp -r electron electron.bak
          cp electron-builder.yml electron-builder.yml.bak
          rm -rf node_modules .git tmp/cache log

      - name: Build Tebako binary
        run: tebako press --root=. --entry-point=bin/rails --output=inferno --Ruby=${{ env.RUBY_VERSION }}

      - name: Re-install node dependencies (for Electron)
        run: |
          cp package.json.bak package.json
          cp bun.lock.bak bun.lock
          cp -r electron.bak electron
          cp electron-builder.yml.bak electron-builder.yml
          bun install --frozen-lockfile

      - name: Stage sidecar binary
        run: |
          mkdir -p binaries
          cp inferno binaries/inferno-server

      - name: Build Electron app
        run: bun run electron:build --mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Inferno-macOS
          path: |
            dist/*.dmg
            dist/*.zip

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml

  # ─── Windows (NSIS installer) ──────────────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: minimal
          update: true
          install: git tar bison flex
          pacboy: >-
            toolchain:p cmake:p ninja:p autotools:p make:p
            boost:p libevent:p double-conversion:p fmt:p glog:p dlfcn:p
            ncurses:p openssl:p libyaml:p libxslt:p ruby:p

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build JS and CSS
        run: |
          bun install --frozen-lockfile
          bun run build
          bun run build:css

      - name: Install Ruby dependencies
        shell: msys2 {0}
        run: |
          gem install bundler
          bundle config set --local without 'development test'
          bundle install

      - name: Precompile assets
        shell: msys2 {0}
        run: |
          SKIP_BUN_INSTALL=true SKIP_JS_BUILD=true SKIP_CSS_BUILD=true \
            SECRET_KEY_BASE=placeholder bundle exec rails assets:precompile

      - name: Prepare for Tebako
        shell: msys2 {0}
        run: |
          cp package.json package.json.bak
          cp bun.lock bun.lock.bak
          cp -r electron electron.bak
          cp electron-builder.yml electron-builder.yml.bak
          rm -rf node_modules .git tmp/cache log

      - name: Install Tebako
        shell: msys2 {0}
        run: gem install tebako

      - name: Build Tebako binary
        shell: msys2 {0}
        run: tebako press --root=. --entry-point=bin/rails --output=inferno.exe --Ruby=${{ env.RUBY_VERSION }}

      - name: Re-install node dependencies (for Electron)
        run: |
          Copy-Item package.json.bak package.json
          Copy-Item bun.lock.bak bun.lock
          Copy-Item -Recurse -Force electron.bak electron
          Copy-Item electron-builder.yml.bak electron-builder.yml
          bun install --frozen-lockfile

      - name: Stage sidecar binary
        run: |
          New-Item -ItemType Directory -Force -Path binaries
          Copy-Item inferno.exe -Destination binaries\inferno-server.exe

      - name: Build Electron app
        run: bun run electron:build --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Inferno-Windows
          path: dist/*.exe

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/latest.yml
