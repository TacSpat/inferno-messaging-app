name: Package Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  RUBY_VERSION: '3.4.2'
  RAILS_ENV: production

jobs:
  # ─── Linux (AppImage + deb) ─────────────────────────────────
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev libsodium23 libfuse2 \
            build-essential pkg-config bison flex autoconf binutils-dev \
            libevent-dev acl-dev libfmt-dev libjemalloc-dev libiberty-dev \
            libdouble-conversion-dev liblz4-dev liblzma-dev libssl-dev libunwind-dev \
            libboost-filesystem-dev libboost-program-options-dev libboost-system-dev \
            libboost-iostreams-dev libboost-date-time-dev libboost-context-dev \
            libboost-regex-dev libboost-thread-dev libbrotli-dev libdwarf-dev \
            libelf-dev libgoogle-glog-dev libffi-dev libgdbm-dev libyaml-dev \
            libncurses-dev libreadline-dev libutfcpp-dev

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          bundle-without: development:test

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Tebako
        run: gem install tebako

      - name: Precompile assets
        run: |
          bun install --frozen-lockfile
          SKIP_BUN_INSTALL=true SECRET_KEY_BASE=placeholder bundle exec rails assets:precompile

      - name: Build Tebako binary
        run: |
          cp package.json package.json.bak
          cp bun.lock bun.lock.bak
          cp -r electron electron.bak
          cp electron-builder.yml electron-builder.yml.bak
          rm -rf node_modules .git tmp/cache log
          tebako press --root=. --entry-point=bin/rails --output=inferno --Ruby=${{ env.RUBY_VERSION }}

      - name: Re-install node dependencies (for Electron)
        run: |
          cp package.json.bak package.json
          cp bun.lock.bak bun.lock
          cp -r electron.bak electron
          cp electron-builder.yml.bak electron-builder.yml
          bun install --frozen-lockfile

      - name: Stage sidecar binary
        run: |
          mkdir -p binaries
          cp inferno binaries/inferno-server

      - name: Build Electron app
        run: bun run electron:build --linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Inferno-Linux
          path: |
            dist/*.AppImage
            dist/*.deb

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/latest-linux.yml

  # ─── macOS (dmg + zip) — disabled until Tebako/folly CMake issue resolved
  # macos:
  #   runs-on: macos-14

  # ─── Windows (NSIS installer) ──────────────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libsodium
        shell: pwsh
        run: |
          $url = "https://download.libsodium.org/libsodium/releases/libsodium-1.0.20-msvc.zip"
          Invoke-WebRequest -Uri $url -OutFile libsodium.zip
          Expand-Archive libsodium.zip -DestinationPath libsodium
          $dll = Get-ChildItem -Path libsodium -Recurse -Filter "libsodium.dll" | Where-Object { $_.FullName -match "x64" -and $_.FullName -match "dynamic" } | Select-Object -First 1
          if (-not $dll) { throw "libsodium.dll not found in archive" }
          Copy-Item $dll.FullName -Destination "packaging\windows\libsodium.dll"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          bundle-without: development:test

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Tebako
        run: gem install tebako

      - name: Precompile assets
        run: |
          bun install --frozen-lockfile
          $env:SECRET_KEY_BASE = "placeholder"
          $env:SKIP_BUN_INSTALL = "true"
          bundle exec rails assets:precompile

      - name: Build Tebako binary
        shell: bash
        run: |
          cp package.json package.json.bak
          cp bun.lock bun.lock.bak
          cp -r electron electron.bak
          cp electron-builder.yml electron-builder.yml.bak
          rm -rf node_modules .git tmp/cache log
          tebako press --root=. --entry-point=bin/rails --output=inferno.exe --Ruby=${{ env.RUBY_VERSION }}

      - name: Re-install node dependencies (for Electron)
        run: |
          Copy-Item package.json.bak package.json
          Copy-Item bun.lock.bak bun.lock
          Copy-Item -Recurse electron.bak electron
          Copy-Item electron-builder.yml.bak electron-builder.yml
          bun install --frozen-lockfile

      - name: Stage sidecar binary
        run: |
          New-Item -ItemType Directory -Force -Path binaries
          Copy-Item inferno.exe -Destination binaries\inferno-server.exe

      - name: Build Electron app
        run: bun run electron:build --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Inferno-Windows
          path: dist/*.exe

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/latest.yml
