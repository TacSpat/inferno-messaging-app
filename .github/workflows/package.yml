name: Package Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  RUBY_VERSION: '3.4.2'
  RAILS_ENV: production

jobs:
  # ─── Linux (AppImage + deb) ─────────────────────────────────
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev libsodium23 libfuse2

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          bundle-without: development:test

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Tebako
        run: gem install tebako

      - name: Precompile assets
        run: |
          bun install --frozen-lockfile
          SECRET_KEY_BASE=placeholder bundle exec rails assets:precompile

      - name: Build Tebako binary
        run: |
          rm -rf node_modules .git tmp/cache log
          tebako press --root=. --entry-point=bin/rails --output=inferno --Ruby=${{ env.RUBY_VERSION }}

      - name: Re-install node dependencies (for Electron)
        run: |
          git checkout -- .
          bun install --frozen-lockfile

      - name: Stage sidecar binary
        run: |
          mkdir -p binaries
          cp inferno binaries/inferno-server

      - name: Build Electron app
        run: bun run electron:build --linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Inferno-Linux
          path: |
            dist/*.AppImage
            dist/*.deb

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/latest-linux.yml

  # ─── macOS (dmg + zip) ─────────────────────────────────────
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: brew install libsodium

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          bundle-without: development:test

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Tebako
        run: gem install tebako

      - name: Precompile assets
        run: |
          bun install --frozen-lockfile
          SECRET_KEY_BASE=placeholder bundle exec rails assets:precompile

      - name: Build Tebako binary
        run: |
          rm -rf node_modules .git tmp/cache log
          tebako press --root=. --entry-point=bin/rails --output=inferno --Ruby=${{ env.RUBY_VERSION }}

      - name: Re-install node dependencies (for Electron)
        run: |
          git checkout -- .
          bun install --frozen-lockfile

      - name: Stage sidecar binary
        run: |
          mkdir -p binaries
          cp inferno binaries/inferno-server

      - name: Build Electron app
        run: bun run electron:build --mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Inferno-macOS
          path: |
            dist/*.dmg
            dist/*.zip

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml

  # ─── Windows (NSIS installer) ──────────────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libsodium
        shell: pwsh
        run: |
          $url = "https://download.libsodium.org/libsodium/releases/libsodium-1.0.20-stable-msvc.zip"
          Invoke-WebRequest -Uri $url -OutFile libsodium.zip
          Expand-Archive libsodium.zip -DestinationPath libsodium
          Copy-Item "libsodium\x64\Release\v143\dynamic\libsodium.dll" -Destination "packaging\windows\libsodium.dll"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          bundle-without: development:test

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Tebako
        run: gem install tebako

      - name: Precompile assets
        shell: bash
        run: |
          bun install --frozen-lockfile
          SECRET_KEY_BASE=placeholder bundle exec rails assets:precompile

      - name: Build Tebako binary
        shell: bash
        run: |
          rm -rf node_modules .git tmp/cache log
          tebako press --root=. --entry-point=bin/rails --output=inferno.exe --Ruby=${{ env.RUBY_VERSION }}

      - name: Re-install node dependencies (for Electron)
        shell: bash
        run: |
          git checkout -- .
          bun install --frozen-lockfile

      - name: Stage sidecar binary
        shell: bash
        run: |
          mkdir -p binaries
          cp inferno.exe binaries/inferno-server.exe

      - name: Build Electron app
        shell: bash
        run: bun run electron:build --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Inferno-Windows
          path: dist/*.exe

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/latest.yml
