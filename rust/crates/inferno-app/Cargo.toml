[package]
name = "inferno-app"
version.workspace = true
edition.workspace = true
description = "Inferno desktop and mobile client (Makepad)."

[[bin]]
name = "inferno"
path = "src/main.rs"

[dependencies]
inferno-core.workspace = true
makepad-widgets.workspace = true
# Makepad's PNG encoder, for cropped avatars and banners.
makepad-zune-png = { git = "https://github.com/makepad/makepad.git", rev = "44a01c5381ab9f26526bd7ad18d30b7d35245599" }
# The same copy Makepad uses (for the vendored RichInput).
# Makepad's copy, for the forked MessageText.
pulldown-cmark = { git = "https://github.com/makepad/makepad.git", rev = "44a01c5381ab9f26526bd7ad18d30b7d35245599", default-features = false }
unicode-segmentation = { git = "https://github.com/makepad/makepad.git", rev = "44a01c5381ab9f26526bd7ad18d30b7d35245599" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Device-local times (the OS timezone, DST included).
# The Unicode emoji set: names, groups, skin tones, shortcodes.
emojis = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
# Copy Image: Makepad's clipboard takes text only. arboard serves image data
# on X11 (large ones too), Windows and macOS.
arboard = "3.6"
