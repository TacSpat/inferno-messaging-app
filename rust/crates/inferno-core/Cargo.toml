[package]
name = "inferno-core"
version.workspace = true
edition.workspace = true
description = "Inferno client core: Nostr protocol, local cache, keys and sync. No UI."

[dependencies]
futures = "0.3"
nostr = { version = "0.45", features = ["nip44", "nip49", "nip59"] }
nostr-sdk = "0.45"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"

keyring-core = "1"
rand = "0.9"

# OS credential stores. Mobile (iOS protected keychain, Android keystore) is
# wired in the mobile pass; see vault::os.
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }
[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[dev-dependencies]
nostr-sdk = { version = "0.45", features = ["local-relay"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
