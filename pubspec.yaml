name: inferno
description: "Inferno — Nostr-native messaging app"
publish_to: 'none'
version: 0.2.7+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Database (SQLite via drift)
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28

  # Routing
  go_router: ^15.1.2

  # Crypto & Nostr
  pointycastle: ^3.9.1
  bech32: ^0.2.2
  hex: ^0.2.0
  convert: ^3.1.2
  crypto: ^3.0.6

  # WebSocket (relay connections)
  web_socket_channel: ^3.0.2

  # HTTP
  http: ^1.3.0

  # SVG rendering
  flutter_svg: ^2.0.17

  # URL launching
  url_launcher: ^6.3.1

  # Secure storage (key encryption at rest)
  flutter_secure_storage: ^9.2.4

  # Image caching
  cached_network_image: ^3.4.1

  # Markdown rendering
  flutter_markdown: ^0.7.6
  markdown: ^7.2.2

  # Syntax highlighting
  flutter_highlight: ^0.7.0

  # Local notifications
  flutter_local_notifications: ^18.0.1

  # File paths & picking
  path_provider: ^2.1.5
  path: ^1.9.1
  file_picker: ^8.1.7
  desktop_drop: ^0.4.4

  # Media playback — video_player + fvp (libmdk backend, cross-platform incl. Linux)
  video_player: ^2.9.2
  fvp: ^0.35.2

  # Audio playback
  just_audio: ^0.9.42

  # Preferences
  shared_preferences: ^2.3.4

  # QR code display for key backup/transfer
  qr_flutter: ^4.1.0

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  collection: ^1.19.1
  ffi: ^2.1.3
  equatable: ^2.0.7
  image: ^4.3.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  scrollable_positioned_list: ^0.3.8

  # Voice/Video (LiveKit)
  livekit_client: ^2.3.3

  # JWT for LiveKit tokens
  dart_jsonwebtoken: ^2.14.1

  # Audio recording (mic test in voice/video settings)
  record: ^6.2.0

  cupertino_icons: ^1.0.8
  in_app_update: ^4.2.5
  upgrader: ^12.5.0
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  drift_dev: ^2.22.1
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  freezed: ^2.5.7
  json_serializable: ^6.9.4

  # Native assets build hook (bundles DeepFilterNet)
  hooks: ^1.0.2
  code_assets: ^1.0.0
  logging: ^1.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/models/
  fonts:
    - family: NotoColorEmoji
      fonts:
        - asset: assets/fonts/NotoColorEmoji.ttf

    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-VariableFont_opsz,wght.ttf
        - asset: assets/fonts/Inter-Italic-VariableFont_opsz,wght.ttf
          style: italic