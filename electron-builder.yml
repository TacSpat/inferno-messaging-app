appId: com.inferno.app
productName: Inferno
directories:
  output: dist

files:
  - electron/**
  - "!node_modules"

extraResources:
  - from: "binaries/"
    to: "binaries"
    filter:
      - "inferno-server*"

linux:
  target:
    - AppImage
    - deb
  category: Network
  icon: icons

mac:
  target:
    - dmg
    - zip
  hardenedRuntime: true
  icon: icons/icon.icns

win:
  target:
    - nsis
  icon: icons/icon.ico

publish:
  provider: github
  owner: TacSpat
  repo: inferno-messaging-app
